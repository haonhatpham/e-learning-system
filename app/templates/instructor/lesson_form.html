{% extends 'layout/base.html' %}

{% block title %}{{ 'Sửa bài học' if lesson else 'Thêm bài học' }} - {{ course.title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h3 class="mb-3">{{ 'Sửa bài học' if lesson else 'Thêm bài học' }} - {{ course.title }}</h3>
    <form method="post">
        <div class="row g-3">
            <div class="col-md-8">
                <div class="mb-3">
                    <label class="form-label">Tiêu đề</label>
                    <input type="text" class="form-control" name="title" required value="{{ lesson.title if lesson else '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">URL nội dung (video, tài liệu...)</label>
                    <input type="text" class="form-control" name="content_url" value="{{ lesson.content_url if lesson else '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Dữ liệu nội dung (JSON) - dùng cho quiz, text...</label>
                    <textarea class="form-control" name="content_data" rows="8">{{ lesson.content_data|tojson if lesson and lesson.content_data else '' }}</textarea>
                </div>
            </div>
            <div class="col-md-4">
                <div class="mb-3">
                    <label class="form-label">Loại bài học</label>
                    <select class="form-select" name="type">
                        {% for lt in LessonType %}
                            <option value="{{ lt.value }}" {% if lesson and lesson.type==lt %}selected{% endif %}>{{ lt.value|upper }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Thứ tự hiển thị</label>
                    <input type="number" class="form-control" name="lesson_order" value="{{ lesson.lesson_order if lesson else 0 }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Thời lượng (giây)</label>
                    <input type="number" class="form-control" name="duration_seconds" value="{{ lesson.duration_seconds if lesson else 0 }}">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="is_preview" id="is_preview" {% if lesson and lesson.is_preview %}checked{% endif %}>
                    <label class="form-check-label" for="is_preview">Cho phép xem trước</label>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a href="{{ url_for('instructor_lessons', course_id=course.id) }}" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>
{% endblock %}
