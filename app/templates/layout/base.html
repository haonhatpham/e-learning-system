<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="E-Learning System - Hệ thống học trực tuyến" name="keywords">
    <meta content="Hệ thống học trực tuyến hiện đại với nhiều khóa học chất lượng" name="description">

    <title>{% block title %}E-Learning System - Hệ thống học trực tuyến{% endblock %}</title>

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>

<body>
    <!-- Spinner Start -->
    <div id="spinner" class="bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center" style="display: none;">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Đang tải...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Flash Messages Start -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <script id="flash-data" type="application/json">{{ messages|tojson }}</script>
        {% endif %}
    {% endwith %}
    <!-- Flash Messages End -->

    <!-- Navbar Start -->
    {% include 'layout/nav.html' %}
    <!-- Navbar End -->

    <!-- Main Content Start -->
    <main>
        {% block content required %}{% endblock %}
    </main>
    <!-- Main Content End -->

    <!-- Footer Start -->
    {% include 'layout/footer.html' %}
    <!-- Footer End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/easing/1.3/easing.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/waypoints/4.0.1/jquery.waypoints.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Counter-Up/1.0.0/jquery.counterup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/owl-carousel/1.3.3/owl.carousel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>

    <!-- Toastr Configuration -->
    <script>
        // Cấu hình Toastr
        toastr.options = {
            "closeButton": true,
            "debug": false,
            "newestOnTop": true,
            "progressBar": true,
            "positionClass": "toast-bottom-left",
            "preventDuplicates": true,
            "onclick": null,
            "showDuration": "300",
            "hideDuration": "1000",
            "timeOut": "5000",
            "extendedTimeOut": "1000",
            "showEasing": "swing",
            "hideEasing": "linear",
            "showMethod": "fadeIn",
            "hideMethod": "fadeOut"
        };
    </script>

    <!-- Template Javascript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <!-- Initialize WOW.js and hide spinner -->
    <script>
        // Initialize WOW.js
        if (typeof WOW !== 'undefined') {
            new WOW().init();
        }
        
        // Hide spinner when page is loaded
        window.addEventListener('load', function() {
            const spinner = document.getElementById('spinner');
            if (spinner) {
                spinner.style.display = 'none';
            }
            // Render flash messages with Toastr after libs are ready
            try {
                var flashEl = document.getElementById('flash-data');
                if (flashEl && typeof toastr !== 'undefined') {
                    var msgs = JSON.parse(flashEl.textContent || '[]');
                    msgs.forEach(function(entry){
                        var cat = entry[0];
                        var msg = entry[1];
                        if (!msg) return;
                        if (cat === 'success') toastr.success(msg);
                        else if (cat === 'error' || cat === 'danger') toastr.error(msg);
                        else if (cat === 'warning') toastr.warning(msg);
                        else toastr.info(msg);
                    });
                }
            } catch (e) { console.log('flash render error', e); }
        });
        
        // Fallback: hide spinner after 3 seconds
        setTimeout(function() {
            const spinner = document.getElementById('spinner');
            if (spinner) {
                spinner.style.display = 'none';
            }
        }, 3000);
    </script>
</body>
</html>
